plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net/"
    }
}

configurations {
    fml
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"

    implementation "com.mojang:brigadier:1.3.10"

    // compile needed
    compileOnly files("${lib_dir}/MITE-Creation.jar")

    // for testing
    localRuntime "com.github.MinecraftIsTooEasy:ManyLib:2.3.0"
    localRuntime "org.moddedmite:rusted-iron-core:1.5.7"
    localRuntime "org.moddedmite:modern-mite:3.8.0"
    localRuntime "org.moddedmite:ommc:1.4.5"
}

loom {
    accessWidenerPath = file("src/main/resources/ohmycommands.accesswidener")
    mergedMinecraftJar()
    mods {
        "${archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}

def fmlResolvedFile = configurations.fml.files.iterator().next()
loom.setFML(fmlResolvedFile)
dependencies.add("mappings", loom.fmlMCPMappings())

processResources {
    inputs.property "version", project.version

    filesMatching("fml.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
//    project.version += ("-mc" + project.minecraft_version + "-" + new SimpleDateFormat("yyyyMMdd").format(new Date()))
    inputs.property "archivesName", project.archives_base_name

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

tasks.named('runClient', JavaExec).configure { exec ->
    exec.setArgs(['--username', project.property('username'), '--session', '0', '--width', '854', '--height', '480'])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "omc"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

        // Default Maven Central.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
